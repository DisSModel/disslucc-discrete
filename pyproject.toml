[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disslucc-discrete"
version = "0.1.0"
description = "Discrete spatial LUCC models for DisSModel — CLUE-S allocation with logistic regression potential"
readme = "README.md"
authors = [{ name = "Sergio Souza Costa", email = "sergio@ufma.br" }]
license = { text = "MIT" }
dependencies = [
    "dissmodel>=0.6.0,<0.7.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "geopandas>=0.12.0",
    "rasterio>=1.3.0",
    "mapclassify>=2.4.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.0.200",
]

[project.entry-points."dissmodel.executors"]
clue_s_vector   = "disslucc_discrete.executors.clue_s_vector_executor:ClueSVectorExecutor"
lucc_validation = "disslucc_discrete.executors.lucc_validation_executor:LuccValidationExecutor"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E701", "E241", "E203", "E501"] # ignore long lines (E501) as they are often okay in docs/strings
